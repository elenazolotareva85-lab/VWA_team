<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Районы Пхукета — Legion Real Estate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
  :root{
    --gold:#8A6A3C;
    --gold-light:#A57F4B;
    --green:#1E4632;
    --green-deep:#16321F;
    --black:#1E1E1E;
    --bg:#F5F1E9;
    --bg-2:#EFE9DC;
    --panel:#FFFFFF;
    --line:rgba(138,106,60,.32);
    --line-soft:rgba(138,106,60,.16);
    --ink:#23211C;
    --ink-mut:#6B6557;
    --ink-faint:#9A9385;
    --serif:'Fraunces', Georgia, serif;
    --sans:'Montserrat', system-ui, sans-serif;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:var(--sans);font-weight:400;line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit}
  .wrap{max-width:1180px;margin:0 auto;padding:0 24px}

  /* ---------- HERO ---------- */
  .hero{position:relative;overflow:hidden;padding:64px 0 40px;
    background:
      radial-gradient(120% 90% at 85% -10%, rgba(30,70,50,.10), transparent 60%),
      linear-gradient(180deg,#FBF8F1 0%, var(--bg) 100%);
    border-bottom:1px solid var(--line-soft);
  }
  .hero::before{ /* diagonal-cut brand graphic */
    content:"";position:absolute;inset:0;pointer-events:none;opacity:.7;
    background-image:
      linear-gradient(115deg, transparent 48%, var(--line-soft) 48.4%, var(--line-soft) 48.7%, transparent 49.1%),
      linear-gradient(115deg, transparent 63%, var(--line-soft) 63.4%, var(--line-soft) 63.7%, transparent 64.1%),
      linear-gradient(115deg, transparent 78%, var(--line-soft) 78.4%, var(--line-soft) 78.7%, transparent 79.1%);
  }
  .brandrow{display:flex;align-items:center;justify-content:space-between;gap:14px;position:relative;flex-wrap:wrap}
  .lang-toggle{display:inline-flex;border:1px solid var(--line);border-radius:40px;overflow:hidden;flex:0 0 auto}
  .lang-toggle button{font-family:var(--sans);font-size:12px;font-weight:600;letter-spacing:.08em;padding:6px 15px;background:transparent;color:var(--ink-mut);border:0;cursor:pointer;transition:.18s}
  .lang-toggle button.on{background:var(--green);color:#fff}
  .lang-toggle button:not(.on):hover{color:var(--ink)}
  .mark{width:34px;height:34px;flex:0 0 auto}
  .mark svg{display:block;width:100%;height:100%}
  .brand-logo{display:block;height:46px;width:auto}
  .brandname{font-family:var(--serif);font-weight:600;letter-spacing:.18em;
    font-size:14px;text-transform:uppercase;color:var(--green)}
  .brandname small{display:block;font-size:8.5px;letter-spacing:.42em;color:var(--gold);margin-top:1px}

  .eyebrow{position:relative;margin-top:46px;font-size:11.5px;letter-spacing:.34em;
    text-transform:uppercase;color:var(--gold);font-weight:600}
  h1{position:relative;font-family:var(--serif);font-weight:500;
    font-size:clamp(38px,6.5vw,76px);line-height:1.02;letter-spacing:-.01em;margin:14px 0 0;color:var(--green)}
  h1 .it{font-style:italic;color:var(--gold)}
  .lede{position:relative;max-width:600px;margin:22px 0 0;color:var(--ink-mut);font-size:16px}

  .keyfacts{position:relative;display:flex;flex-wrap:wrap;gap:14px;margin-top:34px}
  .fact{flex:1 1 220px;min-width:200px;background:var(--panel);
    border:1px solid var(--line-soft);border-radius:3px;padding:18px 20px;
    box-shadow:0 8px 24px rgba(30,70,50,.05)}
  .fact b{font-family:var(--serif);font-size:30px;font-weight:600;color:var(--gold);display:block;line-height:1}
  .fact span{display:block;margin-top:8px;font-size:12.5px;color:var(--ink-mut);line-height:1.45}

  /* ---------- SECTION SHELL ---------- */
  section{padding:58px 0}
  .sec-head{display:flex;align-items:baseline;gap:16px;margin-bottom:8px}
  .sec-num{font-family:var(--serif);font-size:13px;color:var(--gold);font-style:italic}
  h2{font-family:var(--serif);font-weight:500;font-size:clamp(26px,3.6vw,38px);
    margin:0;letter-spacing:-.01em;color:var(--green)}
  .sec-sub{color:var(--ink-mut);max-width:640px;margin:14px 0 0;font-size:15px}

  /* ---------- MAP ---------- */
  .map-shell{margin-top:30px;border:1px solid var(--line);border-radius:4px;overflow:hidden;
    background:var(--bg-2)}
  #map{height:520px;width:100%;background:#e9e4d8}
  .leaflet-container{font-family:var(--sans)}
  .pin{display:flex;align-items:center;justify-content:center;
    width:26px;height:26px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);
    font-size:11px;font-weight:700;color:#FFF;
    box-shadow:0 2px 8px rgba(0,0,0,.3);border:1.5px solid rgba(255,255,255,.7);
    transition:transform .2s, opacity .2s}
  .pin span{transform:rotate(45deg)}
  .pin.west{background:var(--gold)}
  .pin.east{background:var(--green)}
  .pin.muted{background:#9A9385;color:#fff}
  .pin.dim{opacity:.25}
  .pin.active{transform:rotate(-45deg) scale(1.28);z-index:1000;
    box-shadow:0 0 0 4px rgba(165,127,75,.4),0 4px 14px rgba(0,0,0,.45)}
  .leaflet-popup-content-wrapper{background:#fff;color:var(--ink);border-radius:3px;
    border:1px solid var(--line)}
  .leaflet-popup-tip{background:#fff;border:1px solid var(--line)}
  .leaflet-popup-content{margin:11px 14px;font-size:13px}
  .pop-name{font-family:var(--serif);font-size:16px;color:var(--green);font-weight:600}
  .pop-tag{color:var(--ink-mut);font-size:12px;margin-top:2px}
  .pop-btn{display:inline-block;margin-top:9px;font-size:11px;letter-spacing:.06em;
    color:var(--gold);text-transform:uppercase;cursor:pointer;border-bottom:1px solid var(--line)}

  /* ---------- FILTER CHIPS ---------- */
  .filters{display:flex;flex-wrap:wrap;gap:9px;margin-top:26px}
  .chip{font-family:var(--sans);font-size:12.5px;font-weight:500;letter-spacing:.01em;
    color:var(--ink-mut);background:transparent;border:1px solid var(--line);
    padding:8px 15px;border-radius:40px;cursor:pointer;transition:.18s;white-space:nowrap}
  .chip:hover{border-color:var(--gold);color:var(--ink)}
  .chip.on{background:var(--green);border-color:var(--green);color:#fff;font-weight:600}
  .chip .ct{opacity:.7;font-weight:600;margin-left:5px}
  .chip.on .ct{opacity:.9}

  /* ---------- CARDS ---------- */
  .legend{display:flex;gap:20px;flex-wrap:wrap;margin-top:22px;font-size:11.5px;color:var(--ink-faint);letter-spacing:.02em}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:middle}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:18px;margin-top:24px}
  .card{position:relative;background:var(--panel);border:1px solid var(--line-soft);
    border-radius:4px;padding:22px 22px 20px;transition:.22s;overflow:hidden;
    box-shadow:0 6px 22px rgba(30,70,50,.05)}
  .card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--gold)}
  .card.east::before{background:var(--green)}
  .card.muted::before{background:#9A9385}
  .card:hover{border-color:var(--line);transform:translateY(-2px);box-shadow:0 14px 34px rgba(30,70,50,.10)}
  .card.flash{box-shadow:0 0 0 2px var(--gold),0 14px 34px rgba(30,70,50,.16)}
  .card.hide{display:none}
  .c-top{display:flex;align-items:flex-start;gap:12px}
  .c-no{font-family:var(--serif);font-style:italic;font-size:15px;color:var(--gold);flex:0 0 auto;
    width:30px;height:30px;border:1px solid var(--line);border-radius:50%;display:flex;
    align-items:center;justify-content:center;margin-top:2px}
  .c-name{font-family:var(--serif);font-weight:600;font-size:22px;line-height:1.1;margin:0;color:var(--green)}
  .c-coast{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-faint);margin-top:4px}
  .c-summary{color:var(--ink-mut);font-size:13.5px;margin:14px 0 0}
  .c-meta{display:grid;grid-template-columns:1fr 1fr;gap:7px 14px;margin:16px 0 0;
    padding-top:14px;border-top:1px solid var(--line-soft)}
  .c-meta div{font-size:12px}
  .c-meta dt{color:var(--ink-faint);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:2px}
  .c-meta dd{margin:0;color:var(--ink)}
  .c-notes{margin:14px 0 0;padding:0;list-style:none;font-size:12.5px}
  .c-notes li{position:relative;padding-left:18px;margin-bottom:5px;color:var(--ink-mut)}
  .c-notes li::before{position:absolute;left:0;top:0}
  .c-notes li.ok::before{content:"✓";color:#3f7a53;font-weight:700}
  .c-notes li.no::before{content:"✕";color:#a85c4d;font-weight:700}
  .c-notes li.info::before{content:"i";font-style:italic;color:var(--gold);font-family:var(--serif)}
  .c-proj{margin-top:14px;font-size:11.5px;color:var(--ink-faint)}
  .c-proj b{color:var(--gold);font-weight:600;letter-spacing:.04em}
  .c-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
  .tag{font-size:10.5px;letter-spacing:.02em;color:var(--green);
    background:rgba(30,70,50,.06);border:1px solid var(--line-soft);border-radius:30px;padding:3px 10px}

  /* ---------- TABLE ---------- */
  .tbl-wrap{margin-top:26px;overflow-x:auto;border:1px solid var(--line-soft);border-radius:4px;background:var(--panel)}
  table{border-collapse:collapse;width:100%;min-width:620px;font-size:13px}
  th,td{text-align:left;padding:12px 16px;border-bottom:1px solid var(--line-soft)}
  thead th{font-family:var(--sans);font-weight:600;font-size:10.5px;letter-spacing:.12em;
    text-transform:uppercase;color:#fff;background:var(--green)}
  tbody tr:hover{background:rgba(138,106,60,.07)}
  td:first-child{font-family:var(--serif);font-weight:600;color:var(--green);font-size:14px}
  .dot{color:var(--gold)}

  /* ---------- FOOTER ---------- */
  footer{border-top:1px solid var(--line-soft);padding:40px 0 56px;margin-top:20px;color:var(--ink-faint)}
  .foot-grid{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:24px}
  .foot-grid .big{font-family:var(--serif);font-size:22px;color:var(--green)}
  .foot-note{font-size:12px;max-width:420px;color:var(--ink-mut)}

  @media (max-width:680px){
    .hero{padding:44px 0 30px}
    .keyfacts{flex-direction:column}
    #map{height:420px}
    .grid{grid-template-columns:1fr}
    section{padding:44px 0}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto}}
</style>
</head>

function popupHTML(d){
  return `<div class="pop-name">${tr(d.name)}</div>`+
    `<div class="pop-tag">${tr(d.price)} · ${d.coast==='west'?t().coastShort.west:t().coastShort.east}</div>`+
    `<div class="pop-btn" onclick="goCard(${d.n})">${t().openDistrict}</div>`;
}

const markers = {};
D.forEach(d=>{
  const cls = d.muted ? 'muted' : d.coast;
  const icon = L.divIcon({html:`<div class="pin ${cls}" data-n="${d.n}"><span>${d.n}</span></div>`,
    className:'', iconSize:[26,26], iconAnchor:[13,26], popupAnchor:[0,-24]});
  const mk = L.marker([d.lat,d.lng],{icon}).addTo(lmap);
  mk.bindPopup(popupHTML(d));
  mk.on('click',()=>flashCard(d.n,false));
  markers[d.n]=mk;
});
function pinEl(n){ return document.querySelector('.pin[data-n="'+n+'"]'); }

/* ---------- RENDER: STATIC ---------- */
function renderStatic(){
  const x = t();
  document.documentElement.lang = LANG;
  document.title = x.docTitle;
  document.getElementById('eyebrow').textContent = x.eyebrow;
  document.getElementById('h1').innerHTML = x.h1;
  document.getElementById('lede').textContent = x.lede;
  document.getElementById('keyfacts').innerHTML =
    x.facts.map(f=>`<div class="fact"><b>${f.b}</b><span>${f.s}</span></div>`).join('');
  document.getElementById('sec1h').textContent = x.sec1h;
  document.getElementById('sec1s').textContent = x.sec1s;
  document.getElementById('sec2h').textContent = x.sec2h;
  document.getElementById('sec2s').textContent = x.sec2s;
  document.getElementById('sec3h').textContent = x.sec3h;
  document.getElementById('sec3s').textContent = x.sec3s;
  const sw = ['#8A6A3C','#1E4632','#9A9385'];
  document.getElementById('legend').innerHTML =
    x.legend.map((lg,i)=>`<span><i style="background:${sw[i]}"></i>${lg}</span>`).join('');
  document.getElementById('thead-row').innerHTML =
    x.th.map(h=>`<th>${h}</th>`).join('');
  document.getElementById('foot1').textContent = x.foot1;
  document.getElementById('foot2').textContent = x.foot2;
}

        <div class="c-no">${d.n}</div>
        <div>
          <h3 class="c-name">${tr(d.name)}${d.star?' <span style="color:var(--gold)">★</span>':''}</h3>
          <div class="c-coast">${d.coast==='west'?x.coast.west:x.coast.east}</div>
        </div>
      </div>
      <p class="c-summary">${tr(d.summary)}</p>
      <dl class="c-meta">
        <div><dt>${x.meta[0]}</dt><dd>${tr(d.price)}</dd></div>
        <div><dt>${x.meta[1]}</dt><dd>${tr(d.live)}</dd></div>
        <div><dt>${x.meta[2]}</dt><dd>${tr(d.rent)}</dd></div>
        <div><dt>${x.meta[3]}</dt><dd>${tr(d.infra)}</dd></div>
      </dl>
      <p class="c-summary" style="margin-top:14px">${tr(d.highlights)}</p>
      <ul class="c-notes">${d.notes.map(no=>`<li class="${no[0]}">${tr(no[1])}</li>`).join('')}</ul>
      ${proj.length?`<div class="c-proj">${x.projects} <b>${proj.join(' · ')}</b></div>`:''}
      ${d.personas.length?`<div class="c-tags">${d.personas.map(pp=>`<span class="tag">${personaLabel(pp)}</span>`).join('')}</div>`:''}
    `;
    el.addEventListener('click',()=>{
      lmap.flyTo([d.lat,d.lng],13,{duration:.6});
      markers[d.n].openPopup();
      setActivePin(d.n);
      document.getElementById('map-section').scrollIntoView({behavior:'smooth'});
    });
    grid.appendChild(el);
  });
}

/* ---------- RENDER: TABLE ---------- */
function renderTable(){
  const tbody = document.getElementById('tbody');
  tbody.innerHTML = '';
  D.forEach(d=>{
    const row=document.createElement('tr');
    row.innerHTML = `<td>${tr(d.name)}</td><td>${tr(d.price)}</td><td>${tr(d.live)}</td><td>${tr(d.rent)}</td><td>${tr(d.infra)}</td>`;
    row.style.cursor='pointer';
    row.addEventListener('click',()=>{
      document.getElementById('map-section').scrollIntoView({behavior:'smooth'});
      lmap.flyTo([d.lat,d.lng],13,{duration:.6});
      markers[d.n].openPopup();
      setActivePin(d.n);
    });
    tbody.appendChild(row);
  });
}

/* ---------- RENDER: FILTERS ---------- */
let active='all';
function renderFilters(){
  const fbar = document.getElementById('filters');
  fbar.innerHTML='';
  PERSONAS.forEach(p=>{
    const count = p.id==='all'? D.length : D.filter(d=>d.personas.includes(p.id)).length;
    const b=document.createElement('button');
    b.className='chip'+(p.id===active?' on':'');
    b.dataset.pid=p.id;
    b.innerHTML = personaLabel(p.id) + (p.id==='all'?'':`<span class="ct">${count}</span>`);
    b.addEventListener('click',()=>applyFilter(p.id));
    fbar.appendChild(b);
  });
}
function applyFilter(id){
  active=id;
  document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c.dataset.pid===id));
  D.forEach(d=>{
    const match = id==='all' || d.personas.includes(id);
    const card=document.getElementById('card-'+d.n);
    if(card) card.classList.toggle('hide',!match);
    const pe=pinEl(d.n); if(pe) pe.classList.toggle('dim',!match);
  });
}

/* ---------- INTERACTIONS ---------- */
function setActivePin(n){
  document.querySelectorAll('.pin').forEach(p=>p.classList.remove('active'));
  const pe=pinEl(n); if(pe) pe.classList.add('active');
}
function flashCard(n,scroll){
  const c=document.getElementById('card-'+n); if(!c) return;
  setActivePin(n);
  if(scroll){ c.scrollIntoView({behavior:'smooth',block:'center'}); }
  c.classList.add('flash'); setTimeout(()=>c.classList.remove('flash'),1400);
}
function goCard(n){
  if(active!=='all'){ applyFilter('all'); }
  document.getElementById('districts').scrollIntoView({behavior:'smooth'});
  setTimeout(()=>flashCard(n,true),420);
}
window.goCard=goCard;

/* ---------- LANGUAGE ---------- */
function setLang(lang){
  LANG = lang;
  document.querySelectorAll('#langToggle button').forEach(b=>b.classList.toggle('on',b.dataset.lang===lang));
  renderStatic();
  renderFilters();
  renderCards();
  renderTable();
  Object.values(markers).forEach((mk)=>{});
  D.forEach(d=>markers[d.n].setPopupContent(popupHTML(d)));
  applyFilter(active);
}
document.querySelectorAll('#langToggle button').forEach(b=>{
  b.addEventListener('click',()=>setLang(b.dataset.lang));
});

setLang('ru');
</script>
