<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Метод резонансных продаж — проверка кейсами</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap');

  :root{
    --bg:#1a1a1a;
    --card:#2f2f2f;
    --gold:#c9a961;
    --gold-dim:#9c7d51;
    --text:#eee7d8;
    --text-dim:#a89f8f;
    --wrong:#8a4a4a;
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    padding:32px 16px 80px;
  }

  .wrap{max-width:680px;margin:0 auto;}

  header{text-align:center;margin-bottom:36px;}

  h1{
    font-family:'Playfair Display',serif;
    font-weight:700;
    font-size:28px;
    color:var(--gold);
    margin:0 0 8px;
    letter-spacing:0.3px;
  }

  .subtitle{color:var(--text-dim);font-size:14px;line-height:1.6;max-width:480px;margin:0 auto;}

  .progress-wrap{
    display:flex;
    gap:6px;
    justify-content:center;
    margin:24px 0 8px;
  }

  .dot{
    width:8px;height:8px;border-radius:50%;
    background:#3d3d3d;
    transition:background 0.3s;
  }
  .dot.done{background:var(--gold-dim);}
  .dot.active{background:var(--gold);}

  .progress-label{text-align:center;color:var(--text-dim);font-size:12px;margin-bottom:28px;letter-spacing:0.5px;text-transform:uppercase;}

  .card{
    background:var(--card);
    border:1px solid #3d3d3d;
    border-radius:14px;
    padding:28px 24px;
    margin-bottom:20px;
    display:none;
    animation:fadeIn 0.4s ease;
  }
  .card.active{display:block;}

  @keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

  .case-label{
    display:inline-block;
    font-size:11px;
    letter-spacing:1px;
    text-transform:uppercase;
    color:var(--gold-dim);
    border:1px solid var(--gold-dim);
    border-radius:20px;
    padding:3px 12px;
    margin-bottom:16px;
  }

  .case-text{
    font-size:15px;
    line-height:1.7;
    color:var(--text);
    margin-bottom:22px;
  }

  .case-text .quote{
    color:var(--gold);
    font-style:italic;
  }

  .question{
    font-family:'Playfair Display',serif;
    font-size:17px;
    color:var(--text);
    margin-bottom:16px;
    font-weight:600;
  }

  .options{display:flex;flex-direction:column;gap:10px;margin-bottom:20px;}

  .option{
    background:#252525;
    border:1px solid #3d3d3d;
    border-radius:10px;
    padding:14px 16px;
    font-size:14px;
    line-height:1.5;
    cursor:pointer;
    transition:border-color 0.2s, background 0.2s;
  }
  .option:hover{border-color:var(--gold-dim);}
  .option.selected{border-color:var(--gold);background:#2f2a1f;}

  .options.locked .option{cursor:default;pointer-events:none;}
  .option.correct-reveal{border-color:var(--gold);background:#2f2a1f;}
  .option.wrong-reveal{border-color:var(--wrong);opacity:0.7;}

  .check-btn{
    width:100%;
    background:var(--gold);
    color:#1a1a1a;
    border:none;
    border-radius:10px;
    padding:13px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    letter-spacing:0.3px;
    transition:background 0.2s;
  }
  .check-btn:hover{background:#d9bb7a;}
  .check-btn:disabled{background:#4a4a4a;color:#8a8a8a;cursor:not-allowed;}

  .explanation{
    display:none;
    margin-top:18px;
    padding:16px 18px;
    background:#221f16;
    border-left:3px solid var(--gold);
    border-radius:0 8px 8px 0;
    font-size:14px;
    line-height:1.6;
    color:var(--text-dim);
  }
  .explanation.show{display:block;animation:fadeIn 0.3s ease;}
  .explanation b{color:var(--gold);}

  .nav-btn{
    display:none;
    margin-top:16px;
    width:100%;
    background:transparent;
    color:var(--gold);
    border:1px solid var(--gold-dim);
    border-radius:10px;
    padding:12px;
    font-size:14px;
    font-weight:500;
    cursor:pointer;
  }
  .nav-btn.show{display:block;}
  .nav-btn:hover{background:#2f2a1f;}

  .result-card{
    display:none;
    text-align:center;
    padding:40px 24px;
  }
  .result-card.active{display:block;}
  .result-score{
    font-family:'Playfair Display',serif;
    font-size:42px;
    color:var(--gold);
    margin:12px 0;
  }
  .result-text{color:var(--text-dim);font-size:14px;line-height:1.7;max-width:420px;margin:0 auto 24px;}
  .restart-btn{
    background:transparent;
    border:1px solid var(--gold-dim);
    color:var(--gold);
    padding:12px 28px;
    border-radius:10px;
    cursor:pointer;
    font-size:14px;
  }
  .restart-btn:hover{background:#2f2a1f;}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>Метод резонансных продаж</h1>
    <div class="subtitle">Проверка на реальных кейсах из книги. Читайте ситуацию как звонок с клиентом и выбирайте, что сказать дальше.</div>
  </header>

  <div class="progress-wrap" id="progressDots"></div>
  <div class="progress-label" id="progressLabel">Кейс 1 из 6</div>

  <div id="cardsContainer"></div>

  <div class="result-card" id="resultCard">
    <div class="case-label">Результат</div>
    <div class="result-score" id="resultScore">0 / 6</div>
    <div class="result-text" id="resultText"></div>
    <button class="restart-btn" onclick="restart()">Пройти ещё раз</button>
  </div>
</div>

let current = 0;
let score = 0;
let answered = [];

function render(){
  const container = document.getElementById('cardsContainer');
  container.innerHTML = '';
  cases.forEach((c, i) => {
    const card = document.createElement('div');
    card.className = 'card' + (i === current ? ' active' : '');
    card.id = 'card-' + i;

    let optionsHtml = c.options.map((opt, oi) =>
      `<div class="option" data-idx="${oi}" onclick="selectOption(${i}, ${oi})">${opt.text}</div>`
    ).join('');

    card.innerHTML = `
      <div class="case-label">${c.label}</div>
      ${c.text ? `<div class="case-text">${c.text}</div>` : ''}
      <div class="question">${c.question}</div>
      <div class="options" id="options-${i}">${optionsHtml}</div>
      <button class="check-btn" id="check-${i}" onclick="checkAnswer(${i})" disabled>Проверить ответ</button>
      <div class="explanation" id="explanation-${i}"></div>
      <button class="nav-btn" id="nav-${i}" onclick="nextCase()">${i === cases.length - 1 ? 'Показать результат' : 'Следующий кейс →'}</button>
    `;
    container.appendChild(card);
  });
  renderProgress();
}

function renderProgress(){
  const dotsWrap = document.getElementById('progressDots');
  dotsWrap.innerHTML = cases.map((_, i) => {
    let cls = 'dot';
    if (i < current) cls += ' done';
    if (i === current) cls += ' active';
    return `<div class="${cls}"></div>`;
  }).join('');
  document.getElementById('progressLabel').textContent = `Кейс ${current + 1} из ${cases.length}`;
}

let selected = {};

function selectOption(cardIdx, optIdx){
  if (answered[cardIdx]) return;
  selected[cardIdx] = optIdx;
  document.querySelectorAll(`#options-${cardIdx} .option`).forEach((el, i) => {
    el.classList.toggle('selected', i === optIdx);
  });
  document.getElementById(`check-${cardIdx}`).disabled = false;
}

function checkAnswer(cardIdx){
  if (selected[cardIdx] === undefined || answered[cardIdx]) return;
  answered[cardIdx] = true;
  const c = cases[cardIdx];
  const optsEl = document.getElementById(`options-${cardIdx}`);
  optsEl.classList.add('locked');

  const chosenCorrect = c.options[selected[cardIdx]].correct;
  if (chosenCorrect) score++;

  document.getElementById(`explanation-${cardIdx}`).innerHTML = c.explanation;
  document.getElementById(`explanation-${cardIdx}`).classList.add('show');
  document.getElementById(`check-${cardIdx}`).style.display = 'none';
  document.getElementById(`nav-${cardIdx}`).classList.add('show');
}

function nextCase(){
  if (current < cases.length - 1){
    document.getElementById(`card-${current}`).classList.remove('active');
    current++;
    document.getElementById(`card-${current}`).classList.add('active');
    renderProgress();
  } else {
    showResult();
  }
}

function showResult(){
  document.getElementById('cardsContainer').style.display = 'none';
  document.getElementById('progressDots').style.display = 'none';
  document.getElementById('progressLabel').style.display = 'none';
  const resultCard = document.getElementById('resultCard');
  resultCard.classList.add('active');
  document.getElementById('resultScore').textContent = `${score} / ${cases.length}`;

  let text = '';
  if (score === cases.length){
    text = 'Полное попадание. Вы не просто прочитали метод - вы видите логику за каждой ситуацией. Пробуйте на реальных звонках уже сейчас.';
  } else if (score >= cases.length - 2){
    text = 'Хороший результат. Основную логику вы понимаете - вернитесь к пропущенным кейсам и перечитайте объяснение, там ключевая мысль главы.';
  } else {
    text = 'Стоит перечитать метод ещё раз, особенно главы про воспроизведение и работу с реальностью клиента. Дело не в зазубривании, а в том, чтобы поймать саму логику - тогда кейсы решаются сами.';
  }
  document.getElementById('resultText').textContent = text;
}

function restart(){
  current = 0;
  score = 0;
  answered = [];
  selected = {};
  document.getElementById('cardsContainer').style.display = 'block';
  document.getElementById('progressDots').style.display = 'flex';
  document.getElementById('progressLabel').style.display = 'block';
  document.getElementById('resultCard').classList.remove('active');
  render();
}

render();
</script>

</body>
</html>
