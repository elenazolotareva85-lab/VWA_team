<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Legion Real Estate — Atmos Villas Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1a1a1a;
    --panel:#232323;
    --panel2:#2a2a2a;
    --gold:#c9a961;
    --gold-dark:#9C7D51;
    --text:#f0ece2;
    --text-dim:#a8a29a;
    --good:#7cb88f;
    --bad:#c97a6b;
    --border:#3a3733;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    padding:24px 16px 60px;
  }
  .wrap{max-width:720px;margin:0 auto;}
  header{text-align:center;margin-bottom:28px;position:relative;}
  .logo-img{width:56px;height:56px;margin:0 auto 12px;display:block;}
  .lang-switch{
    position:absolute; top:0; right:0;
    display:flex; gap:6px; background:var(--panel2); border:1px solid var(--border);
    border-radius:20px; padding:3px;
  }
  .lang-btn{
    font-family:'Inter',sans-serif; font-size:12px; font-weight:600; letter-spacing:.4px;
    background:transparent; border:none; color:var(--text-dim); padding:5px 12px; border-radius:16px; cursor:pointer;
  }
  .lang-btn.active{background:var(--gold); color:#1a1a1a;}
  h1{
    font-family:'Playfair Display',serif;
    color:var(--gold);
    font-size:24px;
    margin:0 0 8px;
    letter-spacing:.3px;
  }
  .subtitle{color:var(--text-dim);font-size:14px;line-height:1.5;}
  .blocks-legend{
    display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:14px;
  }
  .legend-item{
    font-size:11px;padding:4px 10px;border-radius:20px;border:1px solid var(--border);
    color:var(--text-dim);
  }
  .progress-bar{
    height:4px;background:var(--panel2);border-radius:4px;overflow:hidden;margin:20px 0 4px;
  }
  .progress-fill{height:100%;background:var(--gold);width:0%;transition:width .3s;}
  .progress-label{font-size:12px;color:var(--text-dim);text-align:right;margin-bottom:20px;}

  .card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:12px;
    padding:24px 22px;
    margin-bottom:18px;
    display:none;
  }
  .card.active{display:block;}
  .block-tag{
    display:inline-block;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.6px;
    color:var(--gold);
    border:1px solid var(--gold-dark);
    padding:3px 10px;
    border-radius:20px;
    margin-bottom:14px;
  }
  .q-type{
    font-size:11px;color:var(--text-dim);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px;
  }
  .q-title{
    font-size:17px;line-height:1.5;margin:0 0 6px;font-weight:600;
  }
  .q-context{
    font-size:14px;color:var(--text-dim);line-height:1.6;margin-bottom:16px;
    background:var(--panel2);border-left:3px solid var(--gold-dark);padding:12px 14px;border-radius:6px;
    white-space:pre-line;
  }
  .options{display:flex;flex-direction:column;gap:10px;margin-bottom:14px;}
  .option{
    text-align:left;
    background:var(--panel2);
    border:1px solid var(--border);
    color:var(--text);
    padding:13px 16px;
    border-radius:8px;
    font-size:14.5px;
    cursor:pointer;
    line-height:1.45;
    transition:border-color .15s, background .15s;
    font-family:'Inter',sans-serif;
  }
  .option:hover{border-color:var(--gold-dark);}
  .option.correct{border-color:var(--good);background:rgba(124,184,143,.12);}
  .option.incorrect{border-color:var(--bad);background:rgba(201,122,107,.12);}
  .option:disabled{cursor:default;}
  .option.dim{opacity:.55;}

  textarea.open-answer{
    width:100%;
    min-height:110px;
    background:var(--panel2);
    border:1px solid var(--border);
    color:var(--text);
    border-radius:8px;
    padding:12px 14px;
    font-family:'Inter',sans-serif;
    font-size:14.5px;
    line-height:1.5;
    resize:vertical;
    margin-bottom:12px;
  }
  textarea.open-answer:focus{outline:none;border-color:var(--gold-dark);}
  textarea.open-answer:disabled{opacity:.7;}

  input.email-input{
    width:100%;
    background:var(--panel2);
    border:1px solid var(--border);
    color:var(--text);
    border-radius:8px;
    padding:13px 16px;
    font-family:'Inter',sans-serif;
    font-size:15px;
    margin-bottom:14px;
  }
  input.email-input:focus{outline:none;border-color:var(--gold-dark);}

  .feedback{
    font-size:13.5px;line-height:1.6;padding:12px 14px;border-radius:8px;margin-top:6px;display:none;
  }
  .feedback.show{display:block;}
  .feedback.ok{background:rgba(124,184,143,.1);border:1px solid rgba(124,184,143,.35);}
  .feedback.no{background:rgba(201,122,107,.1);border:1px solid rgba(201,122,107,.35);}
  .feedback.warn{background:rgba(201,169,97,.1);border:1px solid rgba(201,169,97,.35);}
  .attempts-note{font-size:12px;color:var(--text-dim);margin-top:8px;display:none;}
  .attempts-note.show{display:block;}

  .nav-row{display:flex;justify-content:space-between;margin-top:18px;}
  .btn{
    font-family:'Inter',sans-serif;
    background:transparent;
    border:1px solid var(--gold-dark);
    color:var(--gold);
    padding:10px 20px;
    border-radius:8px;
    font-size:14px;
    cursor:pointer;
    font-weight:600;
  }
  .btn:hover{background:rgba(201,169,97,.1);}
  .btn:disabled{opacity:.3;cursor:default;}
  .btn.primary{background:var(--gold);color:#1a1a1a;border-color:var(--gold);}
  .btn.primary:hover{background:#dab975;}
  .btn.full{width:100%;padding:13px;}

  .result-card{
    background:var(--panel);
    border:1px solid var(--gold-dark);
    border-radius:12px;
    padding:32px 24px;
    text-align:center;
    display:none;
  }
  .result-card.active{display:block;}
  .result-score{
    font-family:'Playfair Display',serif;
    font-size:44px;color:var(--gold);margin:6px 0;
  }
  .result-msg{color:var(--text-dim);font-size:14px;margin-bottom:20px;line-height:1.6;}
  .result-breakdown{
    text-align:left;background:var(--panel2);border-radius:8px;padding:16px 18px;margin:18px 0;font-size:13.5px;
  }
  .result-breakdown div{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--border);}
  .result-breakdown div:last-child{border-bottom:none;}
  .restart-btn{margin-top:8px;}
  .save-status{font-size:12px;color:var(--text-dim);margin-top:10px;}

  .dots{display:flex;justify-content:center;gap:6px;margin-top:16px;flex-wrap:wrap;}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--border);}
  .dot.done{background:var(--gold-dark);}
  .dot.current{background:var(--gold);}
  .dot.open-type{border-radius:2px;}

  .login-card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:12px;
    padding:28px 24px;
    text-align:left;
  }
  .login-card .q-title{margin-bottom:14px;}
  .login-hint{font-size:12.5px;color:var(--text-dim);margin-top:-4px;margin-bottom:16px;line-height:1.5;}
  .login-error{font-size:13px;color:var(--bad);margin-bottom:10px;display:none;}
  .login-error.show{display:block;}

  @media (max-width:480px){
    .lang-switch{position:static;justify-content:center;margin-bottom:12px;}
  }

  @media (max-width:600px){
    body.quiz-active .subtitle,
    body.quiz-active .blocks-legend{display:none;}
    body.quiz-active .logo-img{width:30px;height:30px;margin:0 auto 4px;}
    body.quiz-active h1{font-size:15px;margin-bottom:0;}
    body.quiz-active header{margin-bottom:10px;}
    body.quiz-active .lang-switch{position:absolute;top:0;right:0;margin-bottom:0;}
  }
</style>
</head>

const AI_PROXY_URL = "https://biom-quiz-proxy.legionrealestate95.workers.dev";
const STATS_URL = "https://script.google.com/macros/s/AKfycbwgCDWwGVDCy020Y0OpQPiDG9PZ2mKCD55V6hHA-bB3Z1H4SEsBhZWkLvoB8O7NKQCZ/exec";
const QUIZ_NAME = "Atmos Villas (Koh Phangan)";

let lang = "ru";
let userEmail = "";
let attemptNumber = 1;
let revealMode = false;

let current = 0;
let selectedAnswers = new Array(questions.length).fill(null);
let attemptsCount = new Array(questions.length).fill(0);
let revealed = new Array(questions.length).fill(false);
let openAnswers = new Array(questions.length).fill(null);
let openScores = new Array(questions.length).fill(null);
let openFeedbacks = new Array(questions.length).fill(null);
let openAnswered = new Array(questions.length).fill(false);
let quizStarted = false;

const quizArea = document.getElementById('quizArea');
const progressFill = document.getElementById('progressFill');
const progressLabel = document.getElementById('progressLabel');
const progressBar = document.getElementById('progressBar');
const dotsEl = document.getElementById('dots');
const resultCard = document.getElementById('resultCard');
const loginScreen = document.getElementById('loginScreen');

function t(key){
  return UI_TEXT[lang][key];
}
function fmt(str, vars){
  return str.replace(/\{(\w+)\}/g, (_, k) => vars[k] !== undefined ? vars[k] : '');
}
function questionMetaLabel(q){
  const genericType = {ru:"Вопрос", en:"Question"};
  const counter = fmt(t('questionOf'), {n: current+1, total: questions.length});
  const typeLabel = q.type[lang];
  if(typeLabel === genericType[lang]) return counter;
  return typeLabel + ' · ' + counter;
}

function setLang(l){
  lang = l;
  document.getElementById('langRuBtn').classList.toggle('active', l==='ru');
  document.getElementById('langEnBtn').classList.toggle('active', l==='en');
  applyStaticText();
  if(quizStarted){
    renderQuestion();
  } else if(resultCard.classList.contains('active')){
    // no-op, results only shown at end; static text refreshed already
  }
}

function applyStaticText(){
  document.getElementById('pageTitle').textContent = t('title');
  document.getElementById('pageSubtitle').textContent = t('subtitle');

  const legend = document.getElementById('blocksLegend');
  legend.innerHTML = '';
  t('legend').forEach(item=>{
    const span = document.createElement('span');
    span.className = 'legend-item';
    span.textContent = item;
    legend.appendChild(span);
  });

  document.getElementById('loginTypeLabel').textContent = t('loginType');
  document.getElementById('loginTitleLabel').textContent = t('loginTitle');
  document.getElementById('loginHintLabel').innerHTML = t('loginHint');
  document.getElementById('loginError').textContent = t('loginError');
  document.getElementById('emailInput').placeholder = t('emailPlaceholder');
  document.getElementById('startBtn').textContent = quizStarted ? t('startBtnLoading') : t('startBtn');
  document.getElementById('resultLabelTag').textContent = t('resultLabel');
  document.getElementById('restartBtn').textContent = t('restartBtn');
}

function isValidEmail(v){
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
}

async function startQuiz(){
  const emailInput = document.getElementById('emailInput');
  const err = document.getElementById('loginError');
  const email = emailInput.value.trim().toLowerCase();

  if(!isValidEmail(email)){
    err.classList.add('show');
    return;
  }
  err.classList.remove('show');
  userEmail = email;

  const startBtn = document.getElementById('startBtn');
  startBtn.disabled = true;
  startBtn.textContent = t('startBtnLoading');

  try{
    const res = await fetch(STATS_URL + '?email=' + encodeURIComponent(userEmail) + '&quiz=' + encodeURIComponent(QUIZ_NAME));
    const data = await res.json();
    attemptNumber = (data.attempts || 0) + 1;
  } catch(err2){
    attemptNumber = 1;
  }

  revealMode = attemptNumber >= 3;
  quizStarted = true;
  document.body.classList.add('quiz-active');

  loginScreen.style.display = 'none';
  progressBar.style.display = 'block';
  progressLabel.style.display = 'block';

  renderQuestion();
}

function buildDots(){
  dotsEl.innerHTML = '';
  questions.forEach((q,i)=>{
    const d = document.createElement('div');
    const isDone = q.kind === 'open' ? openAnswered[i] : selectedAnswers[i]!==null;
    d.className = 'dot' + (q.kind === 'open' ? ' open-type' : '') + (isDone ? ' done' : '') + (i===current ? ' current':'');
    dotsEl.appendChild(d);
  });
}

function renderQuestion(){
  quizArea.innerHTML = '';
  resultCard.classList.remove('active');
  const q = questions[current];

  if(q.kind === 'open'){
    renderOpenQuestion(q);
  } else {
    renderClosedQuestion(q);
  }

  updateProgress();
}

function renderClosedQuestion(q){
  const card = document.createElement('div');
  card.className = 'card active';

  const tag = document.createElement('div');
  tag.className = 'block-tag';
  tag.textContent = t('legend')[q.blockIdx];
  card.appendChild(tag);

  const qtype = document.createElement('div');
  qtype.className = 'q-type';
  qtype.textContent = questionMetaLabel(q);
  card.appendChild(qtype);

  const title = document.createElement('div');
  title.className = 'q-title';
  title.textContent = q.title[lang];
  card.appendChild(title);

  if(q.context[lang]){
    const ctx = document.createElement('div');
    ctx.className = 'q-context';
    ctx.textContent = q.context[lang];
    card.appendChild(ctx);
  }

  const opts = document.createElement('div');
  opts.className = 'options';
  q.options[lang].forEach((optText, idx)=>{
    const b = document.createElement('button');
    b.className = 'option';
    b.textContent = optText;
    b.onclick = ()=>handleAnswer(idx);
    opts.appendChild(b);
  });
  card.appendChild(opts);

  const fb = document.createElement('div');
  fb.className = 'feedback';
  fb.id = 'feedback';
  card.appendChild(fb);

  const note = document.createElement('div');
  note.className = 'attempts-note';
  note.id = 'attemptsNote';
  card.appendChild(note);

  card.appendChild(buildNavRow(selectedAnswers[current]===null));
  quizArea.appendChild(card);

  if(selectedAnswers[current]!==null){
    restoreState();
  }
}

function renderOpenQuestion(q){
  const card = document.createElement('div');
  card.className = 'card active';

  const tag = document.createElement('div');
  tag.className = 'block-tag';
  tag.textContent = t('legend')[q.blockIdx];
  card.appendChild(tag);

  const qtype = document.createElement('div');
  qtype.className = 'q-type';
  qtype.textContent = questionMetaLabel(q);
  card.appendChild(qtype);

  const title = document.createElement('div');
  title.className = 'q-title';
  title.textContent = q.title[lang];
  card.appendChild(title);

  if(q.context[lang]){
    const ctx = document.createElement('div');
    ctx.className = 'q-context';
    ctx.textContent = q.context[lang];
    card.appendChild(ctx);
  }

  const ta = document.createElement('textarea');
  ta.className = 'open-answer';
  ta.id = 'openInput';
  ta.placeholder = q.placeholder[lang] || '';
  ta.value = openAnswers[current] || '';
  card.appendChild(ta);

  const checkBtn = document.createElement('button');
  checkBtn.className = 'btn primary';
  checkBtn.id = 'checkBtn';
  checkBtn.textContent = t('checkAiBtn');
  checkBtn.onclick = checkOpenAnswer;
  card.appendChild(checkBtn);

  const fb = document.createElement('div');
  fb.className = 'feedback';
  fb.id = 'feedback';
  card.appendChild(fb);

  card.appendChild(buildNavRow(!openAnswered[current]));
  quizArea.appendChild(card);

  if(openAnswered[current]){
    ta.disabled = true;
    checkBtn.style.display = 'none';
    const fbEl = document.getElementById('feedback');
    if(openScores[current] !== null){
      fbEl.className = 'feedback show ' + (openScores[current] >= 2 ? 'ok' : 'warn');
      fbEl.innerHTML = '<b>' + t('aiScoreLabel') + ': ' + openScores[current] + '/3</b><br>' + openFeedbacks[current];
    } else {
      fbEl.className = 'feedback show no';
      fbEl.textContent = openFeedbacks[current] || t('aiNotScoredMsg');
    }
  }
}

function buildNavRow(nextDisabled){
  const nav = document.createElement('div');
  nav.className = 'nav-row';
  const prevBtn = document.createElement('button');
  prevBtn.className = 'btn';
  prevBtn.textContent = t('backBtn');
  prevBtn.disabled = current===0;
  prevBtn.onclick = ()=>{ current--; renderQuestion(); };
  const nextBtn = document.createElement('button');
  nextBtn.className = 'btn primary';
  nextBtn.id = 'nextBtn';
  nextBtn.textContent = current===questions.length-1 ? t('finishBtn') : t('nextBtn');
  nextBtn.disabled = nextDisabled;
  nextBtn.onclick = ()=>{
    if(current===questions.length-1){ showResults(); }
    else { current++; renderQuestion(); }
  };
  nav.appendChild(prevBtn);
  nav.appendChild(nextBtn);
  return nav;
}

function handleAnswer(idx){
  const q = questions[current];
  const optButtons = document.querySelectorAll('.option');
  const isCorrect = idx === q.correct;

  if(selectedAnswers[current]===null || !revealed[current]){
    attemptsCount[current]++;
  }
  selectedAnswers[current] = idx;

  const fb = document.getElementById('feedback');
  const note = document.getElementById('attemptsNote');

  if(isCorrect){
    optButtons[idx].classList.add('correct');
    optButtons.forEach((b,i)=>{ if(i!==idx) b.disabled = true; });
    fb.className = 'feedback show ok';
    fb.textContent = t('correctPrefix') + q.explain[lang];
    revealed[current] = true;
  } else {
    optButtons[idx].classList.add('incorrect');
    optButtons[idx].disabled = true;

    const shouldReveal = revealMode || attemptsCount[current] >= 3;

    if(shouldReveal){
      optButtons[q.correct].classList.add('correct');
      optButtons.forEach(b=>b.disabled = true);
      fb.className = 'feedback show ok';
      fb.textContent = t('revealedPrefix') + q.explain[lang];
      revealed[current] = true;
    } else {
      fb.className = 'feedback show no';
      fb.textContent = t('wrongTryAgain');
      note.className = 'attempts-note show';
      note.textContent = fmt(t('attemptLabel'), {n: attemptsCount[current]});
    }
  }

  document.getElementById('nextBtn').disabled = false;
  buildDots();
}

function restoreState(){
  const q = questions[current];
  const optButtons = document.querySelectorAll('.option');
  const fb = document.getElementById('feedback');
  const note = document.getElementById('attemptsNote');
  const chosen = selectedAnswers[current];

  if(revealed[current]){
    optButtons[q.correct].classList.add('correct');
    optButtons.forEach(b=>b.disabled = true);
    fb.className = 'feedback show ok';
    fb.textContent = (chosen===q.correct ? t('correctPrefix') : t('revealedPrefix')) + q.explain[lang];
  } else if(chosen!==null){
    optButtons[chosen].classList.add('incorrect');
    optButtons[chosen].disabled = true;
    fb.className = 'feedback show no';
    fb.textContent = t('wrongTryAgain');
    note.className = 'attempts-note show';
    note.textContent = fmt(t('attemptLabel'), {n: attemptsCount[current]});
  }
}

async function checkOpenAnswer(){
  const q = questions[current];
  const ta = document.getElementById('openInput');
  const text = ta.value.trim();
  if(!text){
    alert(t('emptyAnswerAlert'));
    return;
  }
  openAnswers[current] = text;

  const btn = document.getElementById('checkBtn');
  btn.disabled = true;
  btn.textContent = t('checkingBtn');

  const fb = document.getElementById('feedback');
  fb.className = 'feedback show warn';
  fb.textContent = t('sendingMsg');

  try{
    const promptText = t('aiPromptIntro') + "\n\n" + q.rubric[lang] + "\n\n" +
      (lang==='ru' ? "Ответ брокера:" : "Broker's answer:") + '\n"""\n' + text + '\n"""\n\n' +
      t('aiPromptTail');

    const response = await fetch(AI_PROXY_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 1000,
        messages: [ { role: "user", content: promptText } ]
      })
    });
    const data = await response.json();
    const textBlock = data.content.find(b => b.type === "text");
    const cleaned = textBlock.text.replace(/```json|```/g, "").trim();
    const parsed = JSON.parse(cleaned);

    openScores[current] = parsed.score;
    openFeedbacks[current] = parsed.feedback;
    openAnswered[current] = true;

    fb.className = 'feedback show ' + (parsed.score >= 2 ? 'ok' : 'warn');
    fb.innerHTML = '<b>' + t('aiScoreLabel') + ': ' + parsed.score + '/3</b><br>' + parsed.feedback;

    ta.disabled = true;
    btn.style.display = 'none';
    document.getElementById('nextBtn').disabled = false;
    buildDots();
  } catch(err){
    fb.className = 'feedback show no';
    fb.textContent = t('aiFailMsg');
    btn.disabled = false;
    btn.textContent = t('checkAiBtn');
    openAnswered[current] = true;
    openScores[current] = null;
    openFeedbacks[current] = t('aiNotScoredMsg');
    document.getElementById('nextBtn').disabled = false;
    buildDots();
  }
}

function updateProgress(){
  progressFill.style.width = ((current+1)/questions.length*100) + '%';
  progressLabel.textContent = fmt(t('questionOf'), {n: current+1, total: questions.length});
  buildDots();
}

function getOpenIndices(){
  const idxs = [];
  questions.forEach((q,i)=>{ if(q.kind === 'open') idxs.push(i); });
  return idxs;
}

async function showResults(){
  quizArea.innerHTML = '';
  resultCard.classList.add('active');

  let firstTryCount = 0;
  let openTotal = 0;
  let openMax = 0;
  const blockStats = {};

  questions.forEach((q,i)=>{
    const blockName = t('legend')[q.blockIdx];
    if(!blockStats[blockName]) blockStats[blockName] = {closedTotal:0, closedFirstTry:0, openTotal:0, openMax:0};

    if(q.kind === 'closed'){
      const gotFirstTry = attemptsCount[i]===1 && selectedAnswers[i]===q.correct;
      if(gotFirstTry) firstTryCount++;
      blockStats[blockName].closedTotal++;
      if(gotFirstTry) blockStats[blockName].closedFirstTry++;
    } else {
      openMax += 3;
      blockStats[blockName].openMax += 3;
      if(openScores[i] !== null){
        openTotal += openScores[i];
        blockStats[blockName].openTotal += openScores[i];
      }
    }
  });

  const closedTotalQ = questions.filter(q=>q.kind==='closed').length;
  document.getElementById('resultScore').textContent = firstTryCount + ' / ' + closedTotalQ;

  let msg = '';
  const pct = Math.round(firstTryCount/closedTotalQ*100);
  if(pct >= 85) msg = t('resultGoodMsg');
  else if(pct >= 60) msg = t('resultMidMsg');
  else msg = t('resultLowMsg');
  msg += fmt(t('openScoreSummary'), {t: openTotal, m: openMax});
  document.getElementById('resultMsg').textContent = fmt(t('firstTryTemplate'), {f: firstTryCount, total: closedTotalQ, pct: pct, msg: msg});

  const breakdown = document.getElementById('resultBreakdown');
  breakdown.innerHTML = '';
  Object.keys(blockStats).forEach(block=>{
    const s = blockStats[block];
    const row = document.createElement('div');
    row.innerHTML = '<span>' + block + t('closedSuffix') + '</span><span>' + s.closedFirstTry + ' / ' + s.closedTotal + '</span>';
    breakdown.appendChild(row);
    if(s.openMax > 0){
      const row2 = document.createElement('div');
      row2.innerHTML = '<span>' + block + t('openSuffix') + '</span><span>' + s.openTotal + ' / ' + s.openMax + '</span>';
      breakdown.appendChild(row2);
    }
  });

  progressFill.style.width = '100%';
  progressBar.style.display = 'none';
  progressLabel.style.display = 'none';

  await saveResultsToSheet(firstTryCount, closedTotalQ, pct);
}

async function saveResultsToSheet(mcqScore, mcqTotal, mcqPercent){
  const saveStatus = document.getElementById('saveStatus');
  saveStatus.textContent = t('savingMsg');

  const openIdxs = getOpenIndices();
  const payload = {
    email: userEmail,
    quiz: QUIZ_NAME,
    attempt: attemptNumber,
    mcqScore: mcqScore,
    mcqPercent: mcqPercent,
    open1Answer: openIdxs[0] !== undefined ? (openAnswers[openIdxs[0]] || "") : "",
    open1Score: openIdxs[0] !== undefined ? openScores[openIdxs[0]] : undefined,
    open2Answer: openIdxs[1] !== undefined ? (openAnswers[openIdxs[1]] || "") : "",
    open2Score: openIdxs[1] !== undefined ? openScores[openIdxs[1]] : undefined,
    open3Answer: openIdxs[2] !== undefined ? (openAnswers[openIdxs[2]] || "") : "",
    open3Score: openIdxs[2] !== undefined ? openScores[openIdxs[2]] : undefined
  };

  try{
    await fetch(STATS_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload)
    });
    saveStatus.textContent = t('savedMsg');
  } catch(err){
    saveStatus.textContent = t('saveFailMsg');
  }
}

function restartQuiz(){
  current = 0;
  selectedAnswers = new Array(questions.length).fill(null);
  attemptsCount = new Array(questions.length).fill(0);
  revealed = new Array(questions.length).fill(false);
  openAnswers = new Array(questions.length).fill(null);
  openScores = new Array(questions.length).fill(null);
  openFeedbacks = new Array(questions.length).fill(null);
  openAnswered = new Array(questions.length).fill(false);
  quizStarted = false;
  document.body.classList.remove('quiz-active');

  loginScreen.style.display = 'block';
  progressBar.style.display = 'none';
  progressLabel.style.display = 'none';
  resultCard.classList.remove('active');
  quizArea.innerHTML = '';
  dotsEl.innerHTML = '';
  const startBtn = document.getElementById('startBtn');
  startBtn.disabled = false;
  startBtn.textContent = t('startBtn');
}

applyStaticText();

</script>
