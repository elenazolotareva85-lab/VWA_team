<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Здание Legion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..700;1,400..600&family=Inter:wght@400;500;600&display=swap">
<style>
  :root{
    color-scheme: dark;
    --bg:#151517; --bg2:#1c1c1f; --stone:#2a2926; --stone-hi:#35332e; --stone-edge:#46423a;
    --gold:#c9a961; --gold-hi:#e3cb8a; --gold-lo:#9c7d51; --pale:#ecdca4;
    --text:#dcd8cf; --muted:#9c978c; --line:#3a3833;
    --serif:'Playfair Display', Georgia, 'Times New Roman', serif;
    --sans:Inter, 'Helvetica Neue', Arial, sans-serif;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{background:var(--bg)}
  body{margin:0; color:var(--text); font-family:var(--sans); font-size:15px; line-height:1.5; padding-inline:16px; padding-block:32px 64px}
  .wrap{max-width:1040px; margin:0 auto; display:flex; flex-direction:column; align-items:center; gap:28px}
  header{display:flex; flex-direction:column; align-items:center; gap:10px; text-align:center}
  header img{width:200px; height:auto}
  .hint{color:var(--muted); font-size:13px; letter-spacing:.04em}

  /* ——— building ——— */
  .building{width:100%; max-width:960px; display:flex; flex-direction:column; align-items:center}
  .pediment{width:100%; position:relative; aspect-ratio: 960 / 190; max-width:100%;
    background:linear-gradient(180deg,#3a372f 0%, #2b2924 100%);
    clip-path:polygon(50% 0, 100% 100%, 0 100%);
    display:flex; align-items:flex-end; justify-content:center; padding-bottom:4%;
    cursor:pointer; border:0; color:inherit; font:inherit; transition:filter .2s}
  .pediment:hover,.pediment:focus-visible{filter:brightness(1.18)}
  .pediment:focus-visible{outline:none}
  .ped-inner{display:flex; flex-direction:column; align-items:center; gap:2px}
  .ped-label{font-family:var(--sans); font-size:clamp(10px,1.4vw,13px); letter-spacing:.3em; text-transform:uppercase; color:var(--gold)}
  .ped-title{font-family:var(--serif); font-size:clamp(20px,3.4vw,34px); color:var(--pale); line-height:1.1}
  .entablature{width:100%; background:linear-gradient(180deg,#312f29,#262520); border-top:1px solid var(--stone-edge); border-bottom:3px solid var(--gold-lo);
    padding:12px 16px; text-align:center; display:flex; flex-wrap:wrap; justify-content:center; align-items:baseline; gap:4px 14px}
  .ent-title{font-family:var(--serif); font-size:clamp(18px,2.6vw,26px); color:var(--pale)}
  .ent-sub{font-family:var(--serif); font-style:italic; color:var(--muted); font-size:clamp(13px,1.6vw,16px)}
  .colonnade{width:96%; display:grid; grid-template-columns:repeat(9,minmax(0,1fr)); gap:clamp(4px,0.8vw,8px); padding:0 1%;
    background:linear-gradient(180deg,#1a1a1c,#202023)}
  .col{display:flex; flex-direction:column; align-items:center}
  .capital{width:100%; height:12px; background:linear-gradient(180deg,#4a463d,#35322c); border-radius:0 0 3px 3px}
  .shaft{width:84%; height:clamp(200px,26vw,260px); position:relative;
    background:repeating-linear-gradient(90deg,#3b3831 0 18%,#2e2c27 18% 22%);
    display:flex; align-items:center; justify-content:center; padding:10px 0}
  .shaft span{position:relative; width:118%; background:#1d1c1a; border-top:1px solid var(--gold-lo); border-bottom:1px solid var(--gold-lo);
    padding:10px 4px; font-size:clamp(11px,1.2vw,13px); font-weight:500; color:var(--pale);
    line-height:1.25; text-align:center; hyphens:manual; -webkit-hyphens:manual; overflow-wrap:break-word}
  .base{width:100%; height:10px; background:linear-gradient(180deg,#35322c,#4a463d); border-radius:3px 3px 0 0}
  .steps{width:100%; display:flex; flex-direction:column; align-items:center}
  .steps i{display:block; height:10px; background:#3a372f; border-bottom:1px solid #22211d}
  .steps i:nth-child(1){width:96%} .steps i:nth-child(2){width:98%} .steps i:nth-child(3){width:100%}

  /* ——— foundation ——— */
  .foundation{width:100%; margin-top:0; background:linear-gradient(180deg,#141416,#101012); border-top:3px solid var(--gold-lo);
    padding:18px clamp(8px,2vw,20px) 22px; display:flex; flex-direction:column; gap:14px}
  .f-head{display:flex; flex-wrap:wrap; justify-content:space-between; align-items:baseline; gap:4px 14px}
  .f-title{font-family:var(--serif); font-size:clamp(20px,2.8vw,28px); color:var(--pale)}
  .f-sub{font-family:var(--serif); font-style:italic; color:var(--muted)}
  .f-count{font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums}
  .course{display:grid; gap:8px}
  .c4{grid-template-columns:repeat(4,minmax(0,1fr))}
  .c3{grid-template-columns:repeat(3,minmax(0,1fr)); padding-inline:12.5%}
  .brick{appearance:none; border:1px solid var(--stone-edge); border-radius:3px; cursor:pointer; text-align:left; color:var(--text); font:inherit;
    background:linear-gradient(160deg,var(--stone-hi) 0%, var(--stone) 70%, #24231f 100%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.05), inset 0 -3px 0 rgba(0,0,0,.35);
    padding:14px 14px 12px; min-height:92px; display:flex; flex-direction:column; justify-content:space-between; gap:8px;
    transition:transform .18s ease, border-color .18s, box-shadow .18s}
  .brick:hover{transform:translateY(-3px); border-color:var(--gold); box-shadow:0 8px 24px rgba(201,169,97,.18), inset 0 -3px 0 rgba(0,0,0,.35)}
  .brick:focus-visible{outline:2px solid var(--gold-hi); outline-offset:2px}
  .brick .n{font-family:var(--serif); color:var(--gold); font-size:15px; font-variant-numeric:tabular-nums; display:flex; justify-content:space-between; align-items:center}
  .brick .seen{width:7px; height:7px; border-radius:50%; background:transparent; border:1px solid var(--gold-lo)}
  .brick.opened .seen{background:var(--gold)}
  .brick .nm{font-family:var(--serif); font-size:clamp(14px,1.45vw,17px); line-height:1.2; color:var(--pale); hyphens:auto; -webkit-hyphens:auto; overflow-wrap:break-word}

  /* ——— dialog ——— */
  .scrim{position:fixed; inset:0; background:rgba(8,8,9,.78); backdrop-filter:blur(4px); display:flex; align-items:center; justify-content:center; padding:16px; z-index:10}
  .card{width:min(920px,100%); max-height:calc(100% - 32px); overflow:auto; background:var(--bg2); border:1px solid var(--line); border-radius:6px;
    display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.1fr); box-shadow:0 30px 90px rgba(0,0,0,.6); animation:rise .28s ease}
  @keyframes rise{from{transform:translateY(14px); opacity:.4}to{transform:none; opacity:1}}
  .card .ph{min-height:420px; background:#0f0f10 center/cover no-repeat}
  .card .ph.gold{background:linear-gradient(135deg,#e3cb8a 0%,#c9a961 55%,#a8864f 100%); display:flex; align-items:center; justify-content:center}
  .card .ph.gold img{width:60%; filter:brightness(.2); opacity:.45}
  .card .ph.ic{background:radial-gradient(circle at 50% 45%, rgba(201,169,97,.22), rgba(201,169,97,0) 60%), linear-gradient(160deg,#26251f,#141416); display:flex; align-items:center; justify-content:center; color:var(--gold-hi)}
  .big-ic{width:46%; max-width:220px; height:auto}
  .bi{width:26px; height:26px; color:var(--gold)}
  .brick{position:relative}
  .brick .seen{position:absolute; right:10px; bottom:10px}
  .brick:hover .bi{color:var(--gold-hi)}
  .card .body{padding:32px clamp(20px,3vw,40px); display:flex; flex-direction:column; gap:16px}
  .card .eyebrow{font-size:12px; letter-spacing:.3em; text-transform:uppercase; color:var(--gold); font-weight:600}
  .card .big{font-family:var(--serif); font-size:clamp(64px,9vw,104px); line-height:.9; color:var(--gold)}
  .card .rule{width:72px; height:2px; background:var(--gold)}
  .card h2{margin:0; font-family:var(--serif); font-weight:500; font-size:clamp(26px,3.4vw,38px); line-height:1.1; color:var(--pale); overflow-wrap:anywhere; text-wrap:balance}
  .card p.desc{margin:0; font-size:16px; line-height:1.6; max-width:52ch; color:var(--text)}
  .card .nav{margin-top:auto; display:flex; gap:8px; justify-content:space-between; align-items:center; padding-top:16px}
  .btn{min-width:48px; font-size:18px!important; appearance:none; background:transparent; border:1px solid var(--line); color:var(--text); font:inherit; font-size:14px; padding:9px 14px; border-radius:4px; cursor:pointer}
  .btn:hover{border-color:var(--gold); color:var(--pale)}
  .btn:focus-visible{outline:2px solid var(--gold-hi); outline-offset:2px}
  .btn.x{position:sticky; top:0}
  .mission-card{grid-template-columns:1fr}
  .mission-card .body{padding:40px clamp(20px,5vw,64px) 32px; gap:20px}
  .mission-card p.mt{margin:0; font-family:var(--serif); font-size:clamp(20px,2.6vw,28px); line-height:1.45; color:var(--pale); max-width:40ch}

  @media (max-width:640px){
    .colonnade{grid-template-columns:repeat(3,minmax(0,1fr)); gap:0 10px; padding:0 3%}
    .shaft{height:150px}
    .shaft span{font-size:13px; width:112%}
    .c4,.c3{grid-template-columns:repeat(2,minmax(0,1fr)); padding-inline:0}
    .card{grid-template-columns:1fr}
    .card .ph{min-height:260px}
  }
  @media (prefers-reduced-motion:reduce){ *{transition:none!important; animation:none!important} }
</style>

</head>

const cols = document.getElementById('cols');
PRINCIPLES.forEach(p => {
  const c = document.createElement('div'); c.className = 'col';
  c.innerHTML = '<div class="capital"></div><div class="shaft"><span></span></div><div class="base"></div>';
  c.querySelector('span').textContent = p;
  cols.appendChild(c);
});

const opened = new Set();
const rows = [document.getElementById('r1'), document.getElementById('r2'), document.getElementById('r3')];
const bricks = [];
VALUES.forEach((v, i) => {
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'brick'; b.id = 'brick-' + v.n;
  b.innerHTML = '<span class="n"><span></span>' + icon(v.ic, 'bi') + '</span><span class="nm"></span><span class="seen" aria-hidden="true"></span>';
  b.querySelector('.n span').textContent = v.n;
  b.querySelector('.nm').textContent = v.name;
  b.addEventListener('click', () => openValue(i));
  rows[Math.floor(i / 4)].appendChild(b);
  bricks.push(b);
});

const scrim = document.getElementById('scrim');
let current = -1, lastFocus = null;

function esc(s){ const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

function openValue(i){
  current = i; const v = VALUES[i];
  opened.add(i); bricks[i].classList.add('opened');
  const photo = '<div class="ph ic">' + icon(v.ic, 'big-ic') + '</div>';
  show('<div class="card" role="dialog" aria-modal="true" aria-labelledby="vt">' + photo +
    '<div class="body"><span class="eyebrow">Ценности</span><span class="big">' + v.n + '</span><span class="rule"></span>' +
    '<h2 id="vt">' + esc(v.name) + '</h2>' + (v.d ? '<p class="desc">' + esc(v.d) + '</p>' : '') +
    '<div class="nav"><button class="btn" id="prev" type="button" aria-label="Предыдущая">←</button>' +
    '<button class="btn" id="close" type="button" aria-label="Закрыть">×</button>' +
    '<button class="btn" id="next" type="button" aria-label="Следующая">→</button></div></div></div>');
  document.getElementById('prev').onclick = () => openValue((current + TOTAL - 1) % TOTAL);
  document.getElementById('next').onclick = () => openValue((current + 1) % TOTAL);
  document.getElementById('close').onclick = hide;
  document.getElementById('next').focus();
}

function openMission(){
  current = -1;
  show('<div class="card mission-card" role="dialog" aria-modal="true" aria-labelledby="mt"><div class="body">' +
    '<span class="eyebrow" id="mt">Миссия Легион</span><span class="rule"></span><p class="mt">' + esc(MISSION) + '</p>' +
    '<div class="nav"><span></span><button class="btn" id="close" type="button" aria-label="Закрыть">×</button></div></div></div>');
  document.getElementById('close').onclick = hide;
  document.getElementById('close').focus();
}

function show(html){
  if (scrim.hidden) lastFocus = document.activeElement;
  scrim.innerHTML = html; scrim.hidden = false;
}
function hide(){
  scrim.hidden = true; scrim.innerHTML = ''; current = -1;
  if (lastFocus && lastFocus.focus) lastFocus.focus();
}
scrim.addEventListener('click', e => { if (e.target === scrim) hide(); });
document.addEventListener('keydown', e => {
  if (scrim.hidden) return;
  if (e.key === 'Escape') hide();
  if (current >= 0 && e.key === 'ArrowRight') openValue((current + 1) % TOTAL);
  if (current >= 0 && e.key === 'ArrowLeft') openValue((current + TOTAL - 1) % TOTAL);
});
document.getElementById('ped').addEventListener('click', openMission);
</script>
